<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remilya | Portal Directory</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var rawPath = (window.location.pathname || "").replace(/^\/+|\/+$/g, "");
        var slug = rawPath.split("/")[0].toLowerCase().replace(/[^a-z0-9]/g, "");

        var routes = {
          gensokyo: "https://remilya.dev/Gensokyo/",
          gensokyoatlas: "https://remilya.dev/Gensokyo/",
          higurashi: "https://remilya.dev/Higurashi/",
          higurashitr: "https://remilya.dev/Higurashi/",
          higurashiscriptingtr: "https://remilya.dev/Higurashi/",
          raidou: "https://github.com/Remilya/raidou-remastered-tr",
          raidoutr: "https://github.com/Remilya/raidou-remastered-tr",
          raidouremasteredtr: "https://github.com/Remilya/raidou-remastered-tr",
          scarletsavior: "https://remilya356.itch.io/scarlet-savior",
          scarlet: "https://remilya356.itch.io/scarlet-savior",
          voicevox: "https://github.com/Remilya/voicevox-expressive-tts",
          voicevoxexpressivetts: "https://github.com/Remilya/voicevox-expressive-tts",
          tts: "https://github.com/Remilya/voicevox-expressive-tts",
          scrollhero: "https://github.com/Remilya/scroll-hero",
          watermark: "https://github.com/Remilya/Watermark-Deksmo",
          watermarkdeksmo: "https://github.com/Remilya/Watermark-Deksmo",
          webgrab: "https://github.com/Remilya/DeksmoScrap",
          deksmowebgrab: "https://github.com/Remilya/DeksmoScrap",
          deksmoscrap: "https://github.com/Remilya/DeksmoScrap",
          umineko: "https://manga-tr.com/manga-umineko-no-naku-koro-ni-episode-1-legend-of-the-golden-witch.html",
          rezero: "https://manga-tr.com/manga-rezero-kara-hajimeru-isekai-seikatsu.html",
          x: "https://x.com/Remilya356",
          twitter: "https://x.com/Remilya356",
          github: "https://github.com/Remilya",
          linkedin: "https://tr.linkedin.com/in/ilker-agirkaya",
          itch: "https://remilya356.itch.io/"
        };

        if (slug && routes[slug]) {
          window.location.replace(routes[slug]);
        }
      })();
    </script>
    <style>
      :root {
        --ink: #080312;
        --ink-raise: #110622;
        --ink-panel: #1b0a36;
        --paper: #ede9fe;
        --violet: #7c3aed;
        --amethyst: #9333ea;
        --lavender: #c4b5fd;
        --uv-border: #8b5cf6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--ink);
        color: var(--paper);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 1.5rem;
      }
      .card {
        max-width: 560px;
        width: 100%;
        padding: 2.2rem 2rem;
        background: var(--ink-raise);
        border: 3px solid var(--lavender);
        border-radius: 20px;
        box-shadow: 8px 8px 0 var(--violet);
        text-align: left;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 0.9rem;
      }
      .head img {
        width: 54px;
        height: 54px;
        object-fit: contain;
      }
      .kicker {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background: var(--violet);
        color: #fff;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border-radius: 999px;
      }
      h1 {
        margin: 0 0 0.65rem;
        font-size: clamp(1.75rem, 4vw, 2.3rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1.08;
      }
      h1 span {
        font-size: 1.25em;
        text-shadow: 0.055em 0.055em 0 var(--amethyst);
      }
      p {
        margin: 0 0 1.5rem;
        color: rgba(243, 238, 255, 0.82);
        line-height: 1.55;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0.45rem 1rem;
        border: 2px solid var(--uv-border);
        border-radius: 999px;
        color: var(--paper);
        background: var(--ink-panel);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 800;
        transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      }
      .links a.primary {
        background: var(--violet);
        border-color: var(--lavender);
        color: #f5f3ff;
      }
      .links a:hover {
        transform: translateY(-2px);
        background: var(--amethyst);
        border-color: #f5f3ff;
        color: #f5f3ff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="head">
        <img src="/assets/remilya-icon.png" alt="Remilya" width="54" height="54" />
        <span class="kicker">404 · Sayfa Bulunamadı</span>
      </div>
      <h1><span>S</span>ayfa Bulunamadı</h1>
      <p>Aradığın adres taşınmış veya hiç açılmamış olabilir. Aşağıdaki kısayollardan birini seçebilir ya da ana sayfaya dönebilirsin.</p>
      <div class="links">
        <a class="primary" href="https://remilya.dev/">Remilya.dev</a>
        <a href="https://remilya.dev/Gensokyo/">/Gensokyo</a>
        <a href="https://remilya.dev/Higurashi/">/Higurashi</a>
        <a href="https://remilya.dev/Raidou/">/Raidou</a>
        <a href="https://remilya.dev/ScarletSavior/">/ScarletSavior</a>
        <a href="https://remilya.dev/Voicevox/">/Voicevox</a>
        <a href="https://remilya.dev/ScrollHero/">/ScrollHero</a>
      </div>
    </main>
  </body>
</html>
