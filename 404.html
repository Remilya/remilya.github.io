<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remilya | Route Resolver</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var rawPath = (window.location.pathname || "").replace(/^\/+|\/+$/g, "");
        var slug = rawPath.split("/")[0].toLowerCase().replace(/[^a-z0-9]/g, "");

        var routes = {
          gensokyo: "https://remilya.dev/Gensokyo/",
          gensokyoatlas: "https://remilya.dev/Gensokyo/",
          higurashi: "https://remilya.dev/Higurashi/",
          higurashitr: "https://remilya.dev/Higurashi/",
          higurashiscriptingtr: "https://remilya.dev/Higurashi/",
          raidou: "https://github.com/Remilya/raidou-remastered-tr",
          raidoutr: "https://github.com/Remilya/raidou-remastered-tr",
          raidouremasteredtr: "https://github.com/Remilya/raidou-remastered-tr",
          scarletsavior: "https://remilya356.itch.io/scarlet-savior",
          scarlet: "https://remilya356.itch.io/scarlet-savior",
          voicevox: "https://github.com/Remilya/voicevox-expressive-tts",
          voicevoxexpressivetts: "https://github.com/Remilya/voicevox-expressive-tts",
          tts: "https://github.com/Remilya/voicevox-expressive-tts",
          scrollhero: "https://github.com/Remilya/scroll-hero",
          watermark: "https://github.com/Remilya/Watermark-Deksmo",
          watermarkdeksmo: "https://github.com/Remilya/Watermark-Deksmo",
          webgrab: "https://github.com/Remilya/DeksmoScrap",
          deksmowebgrab: "https://github.com/Remilya/DeksmoScrap",
          deksmoscrap: "https://github.com/Remilya/DeksmoScrap",
          umineko: "https://manga-tr.com/manga-umineko-no-naku-koro-ni-episode-1-legend-of-the-golden-witch.html",
          rezero: "https://manga-tr.com/manga-rezero-kara-hajimeru-isekai-seikatsu.html",
          x: "https://x.com/Remilya356",
          twitter: "https://x.com/Remilya356",
          github: "https://github.com/Remilya",
          linkedin: "https://tr.linkedin.com/in/ilker-agirkaya",
          itch: "https://remilya356.itch.io/"
        };

        if (slug && routes[slug]) {
          window.location.replace(routes[slug]);
        }
      })();
    </script>
    <style>
      :root {
        --void: #08050f;
        --abyss: #0c0918;
        --border: rgba(168, 85, 247, 0.28);
        --violet: #a78bfa;
        --scarlet: #fb7185;
        --text: #f1ecff;
        --muted: #9588aa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 25%, rgba(124, 58, 237, 0.16), transparent 60%), var(--void);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 1.5rem;
      }
      .card {
        max-width: 540px;
        width: 100%;
        padding: 2.4rem 2rem;
        background: var(--abyss);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.72), 0 0 40px rgba(168, 85, 247, 0.12);
      }
      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--scarlet);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.6rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 1.6rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        padding: 0.55rem 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--violet);
        text-decoration: none;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        background: rgba(168, 85, 247, 0.08);
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }
      .links a:hover {
        background: rgba(168, 85, 247, 0.22);
        border-color: #f3e8ff;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">REMILYA.DEV // PORTAL INDEX</p>
      <h1>Route Not Found</h1>
      <p>Select one of the permanent portals below or return to the main portfolio.</p>
      <div class="links">
        <a href="https://remilya.dev/">Remilya.dev →</a>
        <a href="https://remilya.dev/Gensokyo/">/Gensokyo ↗</a>
        <a href="https://remilya.dev/Higurashi/">/Higurashi ↗</a>
        <a href="https://remilya.dev/Raidou/">/Raidou ↗</a>
        <a href="https://remilya.dev/ScarletSavior/">/ScarletSavior ↗</a>
        <a href="https://remilya.dev/Voicevox/">/Voicevox ↗</a>
        <a href="https://remilya.dev/ScrollHero/">/ScrollHero ↗</a>
      </div>
    </main>
  </body>
</html>
